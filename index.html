<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitoreo Postventa BDC</title>
<style>
*{box-sizing:border-box}body{margin:0;font:13px/1.45 -apple-system,"Segoe UI",Inter,Roboto,Arial,sans-serif;background:#f3f5f9;color:#1c2536}
.top{background:#fff;border-bottom:1px solid #e3e8ef;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:19px;color:#0a2b61;letter-spacing:.2px}.top p{margin:2px 0 0;color:#667085;font-size:12px}
details.src{font-size:11.5px;color:#667085;position:relative}details.src summary{cursor:pointer;list-style:none;border:1px solid #cfd6e0;border-radius:999px;padding:4px 11px;background:#fff}
details.src div{position:absolute;right:0;top:30px;background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:10px 12px;width:320px;z-index:20;box-shadow:0 8px 24px rgba(16,24,40,.12);line-height:1.5}
.nav{background:#fff;padding:10px 28px 0;display:flex;gap:6px;border-bottom:1px solid #e3e8ef;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:9px 9px 0 0;font-weight:600;color:#475467;font-size:12.5px;cursor:pointer;border:0;background:none;font-family:inherit}.tab.on{background:#0a2b61;color:#fff}
.flt{background:#fff;border-bottom:1px solid #e3e8ef;padding:10px 28px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.flt label{display:block;font-size:10px;color:#667085;text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:2px}
.flt select{border:1px solid #cfd6e0;border-radius:8px;padding:6px 8px;background:#fff;color:#1c2536;font:inherit;font-size:12px;min-width:140px;max-width:210px}
.btn{border:1px solid #cfd6e0;border-radius:8px;padding:7px 12px;background:#fff;color:#17365d;font:inherit;font-size:12px;font-weight:600;cursor:pointer}.btn.pri{background:#0a2b61;color:#fff;border-color:#0a2b61}
.dl{position:relative;margin-left:auto}.dl .menu{display:none;position:absolute;right:0;top:36px;background:#fff;border:1px solid #e3e8ef;border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.14);width:330px;padding:6px;z-index:30}.dl.open .menu{display:block}
.menu button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;font:inherit;font-size:12.5px;cursor:pointer;color:#1c2536}.menu button:hover{background:#f1f4f9}.menu b{color:#0a2b61}.menu small{display:block;color:#667085;font-size:11px}
.wrap{padding:18px 28px 28px;display:grid;gap:16px;max-width:1500px;margin:0 auto}.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.gf{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:16px 18px;min-width:0}.card.big{padding:18px 20px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.ct{font-size:15px;font-weight:700;color:#0a2b61}.cs{color:#667085;font-size:11.5px}
.num{font-size:40px;font-weight:800;color:#0a2b61;letter-spacing:-1px;line-height:1}.of{font-size:14px;color:#475467;font-weight:600}.pct{font-size:23px;font-weight:800}.pct small{font-size:11.5px;color:#667085;font-weight:500}
.bar{position:relative;height:14px;background:#edf0f5;border-radius:7px;margin:14px 0 8px}.bar i{position:absolute;left:0;top:0;bottom:0;background:#3276d2;border-radius:7px}.bar b{position:absolute;top:-5px;bottom:-5px;width:3px;background:#1c2536;border-radius:2px}.bar u{position:absolute;top:-3px;width:10px;height:20px;margin-left:-5px;border:2px solid #7a5af8;border-radius:5px;background:#fff}
.legend{display:flex;gap:16px;color:#475467;font-size:11.5px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:6px}.k1{width:12px;height:8px;background:#3276d2;border-radius:3px;display:inline-block}.k2{width:3px;height:13px;background:#1c2536;display:inline-block;border-radius:2px}.k3{width:8px;height:13px;border:2px solid #7a5af8;border-radius:4px;display:inline-block}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;border-top:1px solid #eef1f5;padding-top:12px}.grid4 small{display:block;color:#667085;font-size:11px}.grid4 strong{font-size:15px}
.pill{border-radius:999px;padding:5px 11px;font-weight:700;font-size:11.5px;white-space:nowrap}.pill.sm{padding:3px 9px;font-size:10.5px}.pill.g{background:#e7f6ec;color:#17713c}.pill.a{background:#fff4db;color:#8c6400}.pill.r{background:#fdecea;color:#b42318}.pill.n{background:#eef1f5;color:#475467}
.gt{color:#17713c}.at{color:#8c6400}.rt{color:#b42318}
h3{margin:0 0 2px;font-size:13.5px;color:#0a2b61}.h3s{color:#667085;font-size:11.5px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid #cfd6e0;border-radius:8px;overflow:hidden}.seg button{border:0;background:#fff;padding:5px 11px;font:inherit;font-size:11.5px;font-weight:600;color:#475467;cursor:pointer}.seg button.on{background:#0a2b61;color:#fff}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:right;color:#667085;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:1px solid #e3e8ef;white-space:nowrap}th:first-child,td:first-child{text-align:left}td{padding:8px;border-bottom:1px solid #f0f2f6;text-align:right;white-space:nowrap}
.mb{position:relative;height:8px;background:#edf0f5;border-radius:4px;min-width:110px}.mb i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}.mb i.g{background:#2e9e5b}.mb i.a{background:#e0a100}.mb i.r{background:#d9534f}.mb em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#1c2536}
.ax{font-size:10px;fill:#667085}.bl{font-size:10.5px;font-weight:700;fill:#1c2536}.rl{font-size:10.5px;fill:#b42318;font-weight:600}
.al{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f2f6}.al:last-child{border:0}.al b{font-size:19px;color:#0a2b61;min-width:64px;text-align:right}.al span{display:block;font-weight:600}.al small{color:#667085}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.strip div{background:#fff;border:1px solid #e3e8ef;border-radius:12px;padding:12px 14px}.strip small{color:#667085;display:block;font-size:11px}.strip b{font-size:20px;color:#0a2b61}
.note{background:#f1f4f9;border:1px solid #e3e8ef;border-radius:10px;padding:9px 12px;color:#475467;font-size:12px}
.gl{font-size:11px;font-weight:700;color:#667085;text-transform:uppercase;letter-spacing:.6px;margin:4px 0 -6px}
.fx{font-size:11.5px;color:#475467;line-height:1.55;margin-top:6px}.fx b{color:#1c2536}
.fn{font-size:19px;font-weight:800;fill:#fff}.fl{font-size:8.5px;font-weight:700;fill:#fff;letter-spacing:.6px}.fp{font-size:10px;font-weight:700;fill:#475467}.fo{font-size:11.5px;font-weight:800}.fos{font-size:8px}
.soon{padding:40px 20px;text-align:center;color:#667085}.soon b{display:block;color:#0a2b61;font-size:15px;margin-bottom:6px}
.foot{color:#667085;font-size:11px;text-align:right}
@media(max-width:980px){.g2,.g3{grid-template-columns:1fr}.strip{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:1fr 1fr}.wrap,.top,.nav,.flt{padding-left:16px;padding-right:16px}.dl{margin-left:0}}
</style></head><body>
<div class="top"><div><h1>MONITOREO POSTVENTA BDC</h1><p id="sub"></p></div>
<details class="src"><summary>Fuentes</summary><div id="srcTxt"></div></details></div>
<div class="nav" id="nav"></div>
<div class="flt">
 <div><label>Región</label><select id="fReg"></select></div>
 <div><label>Agencia</label><select id="fAg"></select></div>
 <div><label>Modelo</label><select id="fMod"></select></div>
 <div><label>Tipo de cliente</label><select id="fTc"></select></div>
 <div><label>Unidad</label><select id="fUn"></select></div>
 <button class="btn" id="fClr">↺ Limpiar</button>
 <div class="dl" id="dl"><button class="btn pri" id="dlBtn">⬇ Descargar base ▾</button><div class="menu" id="dlMenu"></div></div>
</div>
<div class="wrap" id="view"></div>
<script src="./datos.js"></script>
<script>
const T=window.TB,$=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('es-MX');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>String(s??'').trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const F_CBL=1,F_CDO=2,F_CITA=4,F_SHOW=8,F_NOSHOW=16,F_SIG=32,F_VIS=64,F_AGR=128,F_PORC=256,F_GEST=512,F_AGEND=1024,F_ERR=2048,F_OFE=4096;
const TC=['Persona física','Empresa','Flotilla','Sin dato'],UN=['','Nuevo','Seminuevo'];
const D_TOT=T.dias.total,D_EL=T.dias.transcurridos,D_REM=Math.max(D_TOT-D_EL,1),CORTE_DIA=+T.corte.slice(8,10);
const REG_LABEL={'MICHOACÁN':'Michoacán','QUERÉTARO':'Querétaro','CDMX':'CDMX','INFINITI':'Infiniti'};
const TABS=[['resumen','Resumen'],['embudo','Embudo'],['bases','Bases'],['equipo','Equipo'],['citas','Citas y no shows'],['desc','Descartados y oportunidades']];
let tab='resumen',kindChart='rt',kindAg='rt';
const F={reg:'',ag:'',sub:false,mod:'',tc:'',un:''};
const agName=i=>T.ag[i].n;
function mk(a,s,m,t,u){return r=>{const A=T.ag[r[a]];
  if(F.reg&&A.r!==F.reg)return false;
  if(F.ag!==''){if(r[a]!==+F.ag)return false;if(F.sub&&!r[s])return false}
  if(F.mod!==''&&r[m]!==+F.mod)return false;
  if(F.tc!==''&&r[t]!==+F.tc)return false;
  if(F.un!==''&&r[u]!==+F.un)return false;return true}}
const mRow=mk(2,3,4,5,6),mAux=mk(1,2,3,4,5);
const rows=()=>T.rows.filter(mRow);
const detalle=()=>F.mod!==''||F.tc!==''||F.un!=='';
function filtroTxt(){const p=[];if(F.ag!=='')p.push(F.sub?'Los Reyes (Uruapan)':agName(+F.ag));else if(F.reg)p.push(REG_LABEL[F.reg]||F.reg);else p.push('Grupo Autocom');
  if(F.mod!=='')p.push(T.mod[+F.mod]);if(F.tc!=='')p.push(TC[+F.tc]);if(F.un!=='')p.push(UN[+F.un]);return p.join(' · ')}
/* ---------- filtros ---------- */
function opt(sel,items,first){sel.innerHTML=`<option value="">${first}</option>`+items.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('')}
function fillAg(){const cur=$('fAg').value,o=[];
  T.ag.map((a,i)=>[i,a]).filter(([i,a])=>!F.reg||a.r===F.reg).sort((x,y)=>x[1].n.localeCompare(y[1].n,'es')).forEach(([i,a])=>{o.push([i,a.n]);if(fold(a.n)==='URUAPAN')o.push([i+'|s','Los Reyes (subagencia de Uruapan)'])});
  opt($('fAg'),o,'Todas');if(o.some(x=>String(x[0])===cur))$('fAg').value=cur;else{F.ag='';F.sub=false}}
function initFilters(){
  opt($('fReg'),[...new Set(T.ag.map(a=>a.r))].filter(Boolean).sort().map(r=>[r,REG_LABEL[r]||r]),'Todas');fillAg();
  const cnt={};T.rows.forEach(r=>cnt[r[4]]=(cnt[r[4]]||0)+1);
  opt($('fMod'),Object.keys(cnt).filter(i=>T.mod[i]).sort((a,b)=>T.mod[a].localeCompare(T.mod[b],'es')).map(i=>[i,T.mod[i]]),'Todos');
  opt($('fTc'),TC.map((t,i)=>[i,t]),'Todos');opt($('fUn'),[[1,'Nuevo'],[2,'Seminuevo']],'Todas');
  $('fReg').onchange=e=>{F.reg=e.target.value;fillAg();render()};
  $('fAg').onchange=e=>{const v=e.target.value;F.sub=v.endsWith('|s');F.ag=v===''?'':parseInt(v);render()};
  $('fMod').onchange=e=>{F.mod=e.target.value;render()};$('fTc').onchange=e=>{F.tc=e.target.value;render()};$('fUn').onchange=e=>{F.un=e.target.value;render()};
  $('fClr').onclick=()=>{Object.assign(F,{reg:'',ag:'',sub:false,mod:'',tc:'',un:''});['fReg','fMod','fTc','fUn'].forEach(i=>$(i).value='');fillAg();$('fAg').value='';render()};
  $('dlBtn').onclick=e=>{e.stopPropagation();$('dl').classList.toggle('open')};document.addEventListener('click',()=>$('dl').classList.remove('open'));
}
/* ---------- cálculos ---------- */
function embudo(rs){const o={pot:0,cbl:0,cdo:0,cita:0,show:0,noshow:0,sig:0,vis:0,agr:0};
  rs.forEach(r=>{const f=r[7],c=f&F_CITA;o.pot++;if(c||f&F_CBL)o.cbl++;if(c||(f&F_CBL&&f&F_CDO))o.cdo++;if(c)o.cita++;if(f&F_SHOW)o.show++;if(f&F_NOSHOW)o.noshow++;if(f&F_SIG)o.sig++;if(f&F_VIS&&f&F_CBL)o.vis++;if(f&F_AGR)o.agr++});return o}
function porBase(R){return T.bases.map((b,i)=>Object.assign({base:b},embudo(R.filter(r=>r[1]===i))))}
function suma(list,label){const t={base:label,pot:0,cbl:0,cdo:0,cita:0,show:0,noshow:0,sig:0,vis:0,agr:0};list.forEach(x=>{for(const k in t)if(k!=='base')t[k]+=x[k]});return t}
function objetivo(kind){ // números de SimAnalytics (Performance General por Dealer): por Cve; región y grupo = suma de sus Cve
  if(detalle())return null;const B=T.obj[kind];
  if(F.ag!==''){const n=fold(agName(+F.ag)),e=B.a.find(x=>x.m.some(m=>fold(m)===n));return e?Object.assign({lbl:e.n+(e.m.length>1?' (grupo de la agencia en SimAnalytics)':F.sub?' (incluye Los Reyes)':'')},e):null}
  if(F.reg)return B.r[F.reg]?Object.assign({lbl:REG_LABEL[F.reg]},B.r[F.reg]):null;
  return Object.assign({lbl:'Grupo Autocom · Nissan'},B.g)}
const sim=o=>{const real=o.num/o.den*100,ob=o.ov/o.den*100,falt=Math.max(Math.round(o.ov)-Math.round(o.num),0);return {real,ob,cdo:o.num/o.ov*100,falt,nec:falt/D_REM}};
const semCdo=c=>c>=100?['g','En objetivo']:c>=97?['a','Cerca del objetivo']:['r','Debajo del objetivo'];
const fDia=n=>n<10&&n>0?n.toFixed(1):fmt(n);
const SIMF=T.simFecha?`${+T.simFecha.slice(8,10)} de ${MESES[+T.simFecha.slice(5,7)-1]}`:'';
/* ---------- piezas ---------- */
function cardObj(titulo,desc,kind,act2,univ2,unit){
  const o=objetivo(kind);
  if(!o){const p=univ2?act2/univ2*100:0;return `<div class="card big"><div class="row"><div><div class="ct">${titulo}</div><div class="cs">${desc}</div></div><span class="pill n">Solo avance</span></div>
   <div class="row" style="align-items:flex-end;margin-top:14px"><div><span class="num">${fmt(act2)}</span><span class="of"> ${unit}</span></div><div class="pct">${p.toFixed(1)}%<small> de ${fmt(univ2)} VIN de la base</small></div></div>
   <div class="bar"><i style="width:${Math.min(p,100).toFixed(1)}%"></i></div>
   <div class="grid4"><div><small>Ritmo real</small><strong>${fmt(act2/D_EL)} al día</strong></div><div><small>Días operativos</small><strong>${D_EL} de ${D_TOT}</strong></div><div style="grid-column:span 2"><small>Objetivo</small><strong style="font-size:12px;font-weight:600;color:#667085">${detalle()?'El objetivo viene por agencia; con este filtro se muestra solo el avance.':'Esta selección no tiene objetivo de SimAnalytics.'}</strong></div></div></div>`}
  const m=sim(o),[c,l]=semCdo(m.cdo),sc=Math.max(m.ob,m.real)*1.2,ps=kind==='ps';
  return `<div class="card big"><div class="row"><div><div class="ct">${titulo}</div><div class="cs">${desc} · ${esc(o.lbl)} · SimAnalytics, archivo del ${SIMF}</div></div><span class="pill ${c}">● ${l}</span></div>
  <div class="row" style="align-items:flex-end;margin-top:14px"><div><span class="num">${m.real.toFixed(2)}%</span><span class="of"> objetivo ${m.ob.toFixed(2)}%</span></div><div class="pct ${c}t">${m.cdo.toFixed(1)}%<small> de cumplimiento</small></div></div>
  <div class="bar"><i style="width:${(m.real/sc*100).toFixed(1)}%"></i><b style="left:${(m.ob/sc*100).toFixed(1)}%"></b></div>
  <div class="legend"><span><i class="k1"></i>${ps?'Con primer servicio':'Clientes con visita'}: ${fmt(o.num)} de ${fmt(o.den)}</span><span><b class="k2"></b>Objetivo: ${fmt(o.ov)} VIN</span></div>
  <div class="grid4"><div><small>Faltan para el objetivo</small><strong class="${c}t">${m.falt?fmt(m.falt)+' VIN':'Cumplido'}</strong></div><div><small>Ritmo necesario</small><strong>${m.falt?fDia(m.nec)+' al día':'—'}</strong></div>
   <div><small>${ps?'Ritmo del call center':'Shows del mes en la base'}</small><strong>${ps?fDia(act2/D_EL)+' al día':fmt(act2)}</strong></div><div><small>${ps?'Sin primer servicio':'Días operativos'}</small><strong>${ps?fmt(o.den-o.num):D_EL+' de '+D_TOT}</strong></div></div></div>`}
function chartDia(R){
  const isRt=kindChart==='rt',by={},seen=new Set();
  R.forEach(r=>{if(!r[8]||(isRt?(r[1]<1||r[1]>4):r[1]!==0)||seen.has(r[0]))return;seen.add(r[0]);by[r[8]]=(by[r[8]]||0)+1});
  const days=T.dias.dias.filter(d=>d<=CORTE_DIA),o=isRt?null:objetivo('ps'),line=o?sim(o).nec:0,mx=Math.max(...days.map(d=>by[d]||0),line,1)*1.22;
  const W=640,H=240,ml=36,mb=26,mt=16,cw=W-ml-10,ch=H-mb-mt,bw=cw/days.length,y=v=>mt+ch-(v/mx)*ch;
  const step=Math.pow(10,Math.floor(Math.log10(mx)))/(mx/Math.pow(10,Math.floor(Math.log10(mx)))<2.5?4:mx/Math.pow(10,Math.floor(Math.log10(mx)))<5?2:1);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Por día">`;
  for(let g=0;g<=mx;g+=step)s+=`<line x1="${ml}" x2="${W-10}" y1="${y(g)}" y2="${y(g)}" stroke="#e8ecf2"/><text x="${ml-6}" y="${y(g)+3}" text-anchor="end" class="ax">${fmt(g)}</text>`;
  days.forEach((d,i)=>{const v=by[d]||0,x=ml+i*bw+bw*.18,w=bw*.64,top=y(v),rr=Math.min(4,(y(0)-top)/2);
    s+=`<path d="M${x},${y(0)} V${top+rr} q0,-${rr} ${rr},-${rr} H${x+w-rr} q${rr},0 ${rr},${rr} V${y(0)} Z" fill="#3276d2"><title>Día ${d}: ${fmt(v)}</title></path><text x="${x+w/2}" y="${top-5}" text-anchor="middle" class="bl">${fmt(v)}</text><text x="${x+w/2}" y="${H-8}" text-anchor="middle" class="ax">${String(d).padStart(2,'0')}</text>`});
  if(line)s+=`<line x1="${ml}" x2="${W-10}" y1="${y(line)}" y2="${y(line)}" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-12}" y="${y(line)-6}" text-anchor="end" class="rl">Ritmo necesario para el objetivo: ${fDia(line)} al día</text>`;
  return `<div class="card"><div class="row"><div><h3>${isRt?'Clientes de retención que regresaron':'Primeros servicios realizados'}, por día</h3><div class="h3s">Días operativos de ${MESES[T.mesNum-1]} · clientes de la base del call center que asistieron</div></div>
   <div class="seg"><button class="${isRt?'on':''}" onclick="kindChart='rt';render()">Retención</button><button class="${isRt?'':'on'}" onclick="kindChart='ps';render()">Primer Servicio</button></div></div>${s}</svg></div>`}
function atencion(R){
  const vis=new Set(R.filter(r=>r[1]<5&&r[7]&F_VIS&&r[7]&F_CBL).map(r=>r[0])).size,
   nsAnt=T.ns.filter(mAux).filter(r=>!r[6]).length,
   sig=R.filter(r=>r[1]===0&&r[7]&F_SIG).length,err=R.filter(r=>r[7]&F_ERR).length,sinEj=R.filter(r=>r[7]&F_GEST&&!r[10]).length;
  const sm=MESES[T.mesNum%12];
  const al=[[vis,'VIN por contactar con visita a taller no registrada como servicio','Validar antes de llamar'],[nsAnt,'No shows de meses anteriores en la lista de recuperación','Reagendar · se descargan en "No shows"'],[sig,`Citas de Primer Servicio ya agendadas para ${sm}`,`No cuentan en ${MESES[T.mesNum-1]}`],[err,'Números erróneos capturados en el mes','Corregir el contacto'],[sinEj,'Gestiones sin nombre de ejecutivo','Capturar el ejecutivo']];
  return `<div class="card"><h3>Atención hoy</h3><div class="h3s">Lo que conviene revisar con el equipo</div>${al.map(([n,a,b])=>`<div class="al"><b>${fmt(n)}</b><div><span>${a}</span><small>${b}</small></div></div>`).join('')}</div>`}
function tablaBases(PB){
  return `<div class="card"><h3>Cómo va cada base</h3><div class="h3s">Contactables del mes y cuántos ya se contactaron · la marca negra es el objetivo de contacto (80%)</div><div class="tw"><table><thead><tr><th>Base</th><th>Potencial</th><th>Contactables</th><th>Sin contactar</th><th style="width:20%">Avance de contacto</th><th>Contactado</th><th>Citas del mes</th><th>Shows</th></tr></thead><tbody>${
   PB.map(b=>{const p=b.cbl?b.cdo/b.cbl*100:0,c=p>=80?'g':p>=56?'a':'r';return `<tr><td><b>${b.base}</b></td><td>${fmt(b.pot)}</td><td>${fmt(b.cbl)}</td><td>${fmt(b.cbl-b.cdo)}</td><td><div class="mb"><i class="${c}" style="width:${Math.min(p,100).toFixed(0)}%"></i><em style="left:80%"></em></div></td><td class="${c}t"><b>${p<1&&b.cdo?p.toFixed(1):p.toFixed(0)}%</b></td><td>${fmt(b.cita)}</td><td>${fmt(b.show)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function tablaAgencias(){
  if(detalle())return '';const B=T.obj[kindAg],ps=kindAg==='ps';
  let L=B.a.filter(e=>(!F.reg||e.reg===F.reg)&&(F.ag===''||e.m.some(m=>fold(m)===fold(agName(+F.ag)))));
  if(!L.length)return '';
  L=L.map(e=>({e,m:sim(e)})).sort((x,y)=>x.m.cdo-y.m.cdo);
  return `<div class="card"><div class="row"><div><h3>${ps?'Primer Servicio':'Retención'} por agencia</h3><div class="h3s">Números de SimAnalytics (archivo del ${SIMF}) · de menor a mayor cumplimiento · la marca negra es el 100% del objetivo</div></div>
   <div class="seg"><button class="${ps?'':'on'}" onclick="kindAg='rt';render()">Retención</button><button class="${ps?'on':''}" onclick="kindAg='ps';render()">Primer Servicio</button></div></div>
   <div class="tw"><table><thead><tr><th>Agencia</th><th>${ps?'Con servicio':'Con visita'}</th><th>${ps?'Unidades':'UIO'}</th><th>Real</th><th>Objetivo</th><th style="width:18%">Cumplimiento</th><th>CDO</th><th>Faltan</th><th>Ritmo necesario</th><th>Estado</th></tr></thead><tbody>${
   L.map(({e,m})=>{const [c,l]=semCdo(m.cdo);return `<tr><td><b>${esc(e.n)}</b></td><td>${fmt(e.num)}</td><td>${fmt(e.den)}</td><td>${m.real.toFixed(1)}%</td><td>${m.ob.toFixed(1)}%</td><td><div class="mb"><i class="${c}" style="width:${(Math.min(m.cdo,110)/110*100).toFixed(0)}%"></i><em style="left:${(100/110*100).toFixed(0)}%"></em></div></td><td class="${c}t"><b>${m.cdo.toFixed(1)}%</b></td><td>${m.falt?fmt(m.falt):'Cumplido'}</td><td>${m.falt?fDia(m.nec)+' al día':'—'}</td><td><span class="pill ${c} sm">● ${l}</span></td></tr>`}).join('')}</tbody></table></div></div>`}
function equipo(R){const g=R.filter(r=>r[7]&F_GEST).length,ag=R.filter(r=>r[7]&F_AGEND),co=ag.filter(r=>r[7]&F_SHOW).length;
  return `<div class="strip"><div><small>Gestiones del call center en el mes</small><b>${fmt(g)}</b></div><div><small>Gestiones por día operativo</small><b>${fmt(g/D_EL)}</b></div><div><small>Citas agendadas por el call center</small><b>${fmt(ag.length)}</b></div><div><small>Citas agendadas ya concretadas</small><b>${fmt(co)}</b></div></div>`}
/* ---------- embudo ---------- */
const OBJ=[null,100,80,75,85],COL=['#0a2b61','#3276d2','#8157b7','#16a6a1','#35a854'],LAB=['POTENCIAL','CONTACTABLE','CONTACTADO','CITA','SHOW'];
function funnelSVG(v){const W=290,sh=52,gap=24,H=5*sh+4*gap,cx=108;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:330px">`;
  v.forEach((n,i)=>{const y=i*(sh+gap),w1=186-i*24,w2=w1-22;
    s+=`<path d="M${cx-w1/2},${y} H${cx+w1/2} L${cx+w2/2},${y+sh} H${cx-w2/2} Z" fill="${COL[i]}"/><text x="${cx}" y="${y+27}" text-anchor="middle" class="fn">${fmt(n)}</text><text x="${cx}" y="${y+42}" text-anchor="middle" class="fl">${LAB[i]}</text>`;
    if(i){const prev=v[i-1],p=prev?n/prev*100:null,c=p===null?'n':p>=OBJ[i]?'g':p>=OBJ[i]*.7?'a':'r',bg={g:'#e8f7ec',a:'#fff4db',r:'#feeceb',n:'#f0f2f5'}[c],fg={g:'#20753a',a:'#8c6400',r:'#b42318',n:'#5d6675'}[c];
      s+=`<rect x="${cx-34}" y="${y-gap+4}" width="68" height="16" rx="8" fill="#eef1f6"/><text x="${cx}" y="${y-gap+15.5}" text-anchor="middle" class="fp">↓ ${p===null?'—':p.toFixed(1)+'%'}</text>`;
      s+=`<rect x="226" y="${y+9}" width="58" height="34" rx="9" fill="${bg}"/><text x="255" y="${y+25}" text-anchor="middle" class="fo" fill="${fg}">${p===null?'—':p.toFixed(0)+'%'}</text><text x="255" y="${y+36}" text-anchor="middle" class="fos" fill="${fg}">obj ${OBJ[i]}%</text>`}});
  return s+'</svg>'}
function cardEmb(b){const fut=Math.max(b.cita-b.show-b.noshow,0),pc=(a,c)=>c?(a/c*100).toFixed(1)+'%':'—',sm=MESES[T.mesNum%12];
  if(!b.pot)return `<div class="card"><h3>${esc(b.base)}</h3><div class="soon">Sin datos para esta selección.</div></div>`;
  return `<div class="card"><h3>${esc(b.base)}</h3>${funnelSVG([b.pot,b.cbl,b.cdo,b.cita,b.show])}<div class="fx"><b>Resultado de citas:</b> Show ${fmt(b.show)} (${pc(b.show,b.cita)})${b.noshow?` · No show ${fmt(b.noshow)} (${pc(b.noshow,b.cita)})`:''} · Futuras ${fmt(fut)} (${pc(fut,b.cita)})${
   b.sig?`<br><b>Citas agendadas para ${sm}:</b> ${fmt(b.sig)} (no suman a la cita del mes)`:''}${b.vis?`<br><b>Visita a taller no registrada como servicio:</b> ${fmt(b.vis)} VIN contactables, validar antes de llamar`:''}${b.agr?`<br><b>Agrupados:</b> ${fmt(b.agr)} VIN con el mismo teléfono que otro (se atienden con la llamada del líder)`:''}</div></div>`}
/* ---------- descargas ---------- */
function csv(name,cols,data){const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const txt='﻿'+[cols.join(','),...data.map(r=>r.map(q).join(','))].join('\r\n'),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=name+'_'+filtroTxt().replace(/[^A-Za-z0-9áéíóúñÁÉÍÓÚÑ]+/g,'_')+'_'+T.corte+'.csv';document.body.appendChild(a);a.click();a.remove()}
const COLS=['VIN','Cliente','Teléfono principal','Teléfono 2','Modelo','Año','Agencia','Subagencia','Base','Tipo de cliente','Etapa','Oferta','Último servicio','Asesor que vendió (APV)','Asesor de servicio (última cita)','Ejecutivo call center','Estatus de gestión','Fecha de cita'];
const fila=r=>[r[0],r[13],r[14],r[15],T.mod[r[4]],r[16],agName(r[2]),r[3]?'Los Reyes':'',T.bases[r[1]],TC[r[5]],T.et[r[12]],T.of[r[17]],r[18],T.apv[r[19]],T.as[r[20]],T.ej[r[10]],T.st[r[11]],r[21]];
function descargas(){const R=rows(),uniq=L=>{const s=new Set();return L.filter(r=>!s.has(r[0])&&s.add(r[0]))},
  a=uniq(R.filter(r=>r[7]&F_PORC&&!(r[7]&F_CITA)&&!(r[7]&F_SIG))),c=uniq(R.filter(r=>(r[7]&F_CITA&&!(r[7]&F_SHOW)&&!(r[7]&F_NOSHOW))||r[7]&F_SIG)),n=T.ns.filter(mAux),d=T.desc.filter(mAux).filter(r=>r[6]);
  return [['Por contactar sin cita','Clientes contactables que aún no tienen cita',a.length,()=>csv('Por_contactar_sin_cita',COLS,a.map(fila))],
   ['No shows por recuperar','Lista de recuperación del mes y de meses anteriores',n.length,()=>csv('No_shows',['VIN','Cliente','Teléfono principal','Teléfono 2','Modelo','Año','Agencia','Subagencia','Tipo de cliente','Oferta','Fecha del no show','Origen','Asesor que vendió (APV)','Usuario que agendó','Etapa','Estatus de gestión','Segmento'],n.map(r=>[r[0],r[7],r[8],r[9],T.mod[r[3]],r[10],agName(r[1]),r[2]?'Los Reyes':'',TC[r[4]],r[11],r[12],r[13],r[14],r[15],r[16],r[17],r[18]]))],
   ['Citas futuras','Citas pendientes del mes y las ya agendadas para el mes siguiente',c.length,()=>csv('Citas_futuras',COLS,c.map(fila))],
   ['Descartados con oferta','Clientes descartados que tienen una oferta comercial',d.length,()=>csv('Descartados_con_oferta',['VIN','Cliente','Teléfono principal','Teléfono 2','Modelo','Año','Agencia','Subagencia','Tipo de cliente','Oferta','Motivo de descarte','Mes de descarte','Asesor que vendió (APV)','Segmento'],d.map(r=>[r[0],r[7],r[8],r[9],T.mod[r[3]],r[10],agName(r[1]),r[2]?'Los Reyes':'',TC[r[4]],r[11],r[12],r[13],r[14],r[15]]))]]}
function fillMenu(){const L=descargas();$('dlMenu').innerHTML=`<div style="padding:6px 10px;font-size:11px;color:#667085">Respeta los filtros: <b>${esc(filtroTxt())}</b></div>`+L.map((x,i)=>`<button data-i="${i}"><span>${x[0]}<small>${x[1]}</small></span><b>${fmt(x[2])}</b></button>`).join('');
  $('dlMenu').querySelectorAll('button').forEach(b=>b.onclick=()=>L[+b.dataset.i][3]())}
/* ---------- vistas ---------- */
function vResumen(){const R=rows(),PB=porBase(R),rt=suma(PB.slice(1,5),'Retención');
  return `<div class="g2">${cardObj('Primer Servicio','Unidades con su primer servicio realizado','ps',PB[0].show,PB[0].pot,'servicios')}${cardObj('Retención','Clientes de la base que ya regresaron a servicio','rt',rt.show,rt.pot,'clientes')}</div>
  <div class="g3">${chartDia(R)}${atencion(R)}</div>${tablaBases(PB)}${tablaAgencias()}${equipo(R)}
  <div class="foot">Selección: ${esc(filtroTxt())} · Corte ${T.corte.slice(8,10)} de ${MESES[T.mesNum-1]}</div>`}
function vEmbudo(){const PB=porBase(rows()),tot=suma(PB.slice(1),'Total combinado (Leales + Retenidos + En riesgo + Perdidos + Inactivos)');
  return `<div class="note"><b>Cómo leerlo:</b> Potencial → Contactable → Contactado → Cita → Show. Cada porcentaje se mide sobre la etapa anterior; a la derecha, contra su objetivo. Cita y Show son solo del mes en curso.</div>
  <div class="gl">Primer Servicio</div><div class="gf">${cardEmb(PB[0])}</div><div class="gl">Retención</div><div class="gf">${PB.slice(1).map(cardEmb).join('')}${cardEmb(tot)}</div>`}
const SOON={bases:['Bases','Una sola pestaña con selector de base (Primer Servicio, Leales, Retenidos, En riesgo, Perdidos, Inactivos): avance por agencia y por modelo, y el detalle de VIN plegado al final.'],equipo:['Equipo','Por ejecutivo y por día: gestiones, contactos, citas y shows, comparado contra el promedio del equipo.'],citas:['Citas y no shows','Todas las citas del taller (U13): por día, por tipo, canceladas, y qué pasó después de cada no show.'],desc:['Descartados y oportunidades','Motivos de descarte agrupados, cuáles son recuperables y cuáles tienen oferta.']};
function render(){
  $('nav').innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" data-k="${k}">${l}</button>`).join('');
  $('nav').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.k;render()});
  $('view').innerHTML=tab==='resumen'?vResumen():tab==='embudo'?vEmbudo():`<div class="card soon"><b>${SOON[tab][0]} · en construcción</b>${SOON[tab][1]}<br><br>Mientras tanto, esta información sigue disponible en el tablero anterior.</div>`;
  fillMenu()}
$('sub').textContent=`${T.mes} ${T.anio} · Grupo Autocom · Corte: ${+T.corte.slice(8,10)} de ${MESES[T.mesNum-1]} · día operativo ${D_EL} de ${D_TOT}`;
$('srcTxt').innerHTML=`Archivos de trabajo del call center (Nissan e Infiniti, ${esc(T.archivo)}), citas de Quiter (U13${T.u13?'':' — no llegó hoy'}) y SimAnalytics (Performance General por Dealer del ${SIMF}; grupo y región = suma de sus agencias).<br>Control de carga: ${fmt(T.qa.nissanAContactar)} VIN por contactar en Nissan y ${fmt(T.qa.infinitiAContactar)} en Infiniti.`;
initFilters();render();
</script></body></html>
